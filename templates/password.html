<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enter Password | Routify</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='routify.png') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="app">
        <header class="navbar">
            <div class="navbar-content">
                <a href="{{ url_for('home') }}" class="logo-link" style="text-decoration: none;">
                    <img src="{{ url_for('static', filename='routify.png') }}" alt="Routify Logo" class="logo-img">
                    <span class="logo-text">Routify</span>
                </a>
                <button class="theme-btn" id="themeToggle" title="Toggle theme">
                    <i class="fas fa-moon"></i>
                </button>
            </div>
        </header>

        <main class="content" style="display: flex; align-items: center; justify-content: center; flex: 1;">
            <div class="password-container">
                <div class="password-card">
                    <div class="password-header">
                        <div class="password-icon-box">
                            <i class="fas fa-lock"></i>
                        </div>
                        <h1>This link is password protected</h1>
                        <p>Please enter the password to continue</p>
                    </div>

                    <form id="passwordForm" class="password-form">
                        <div class="input-group">
                            <label for="passwordField" class="label">
                                <i class="fas fa-key"></i> Password
                            </label>
                            <div class="password-input-wrapper">
                                <input 
                                    type="password" 
                                    id="passwordField" 
                                    class="input-field"
                                    placeholder="Enter the password"
                                    required
                                    autofocus
                                >
                                <button type="button" class="password-toggle" id="passwordToggle" title="Show/Hide">
                                    <i class="fas fa-eye"></i>
                                </button>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-arrow-right"></i> Verify Password
                        </button>
                    </form>

                    <div id="errorMessage" class="error-msg" style="display: none;"></div>

                    <div class="password-footer">
                        <p>Forgot the password? <a href="{{ url_for('home') }}">Request a new link</a></p>
                    </div>
                </div>
            </div>
        </main>

        <footer class="footer">
            <div class="footer-inner">
                <div class="footer-left">
                    <p>Created by <strong>Kishore</strong></p>
                    <p class="footer-tagline">Making URL sharing simple, secure, and smart</p>
                </div>
                <div class="footer-center">
                    <a href="https://github.com/MKishoreDev/Routify" target="_blank" class="footer-link">
                        <i class="fab fa-github"></i> GitHub
                    </a>
                </div>
            </div>
        </footer>
    </div>

    <script>
        const themeToggle = document.getElementById('themeToggle');
        const savedTheme = localStorage.getItem('theme') || 'light';
        const passwordForm = document.getElementById('passwordForm');
        const passwordField = document.getElementById('passwordField');
        const passwordToggle = document.getElementById('passwordToggle');
        const errorMessage = document.getElementById('errorMessage');

        function initTheme() {
            if (savedTheme === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
            updateThemeIcon();
        }

        function updateThemeIcon() {
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            themeToggle.innerHTML = isDark ? '<i class="fas fa-sun" style="color: inherit;"></i>' : '<i class="fas fa-moon" style="color: inherit;"></i>';
        }

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';

            if (newTheme === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
            } else {
                document.documentElement.removeAttribute('data-theme');
            }

            updateThemeIcon();
            localStorage.setItem('theme', newTheme);
        }

        function togglePasswordVisibility() {
            const type = passwordField.type === 'password' ? 'text' : 'password';
            passwordField.type = type;
            passwordToggle.innerHTML = type === 'password' 
                ? '<i class="fas fa-eye"></i>' 
                : '<i class="fas fa-eye-slash"></i>';
        }

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.style.display = 'block';
            passwordField.focus();
        }

        function hideError() {
            errorMessage.style.display = 'none';
        }

        async function handlePasswordSubmit(e) {
            e.preventDefault();
            hideError();

            const password = passwordField.value.trim();
            const code = "{{ code }}";

            if (!password) {
                showError('Please enter a password');
                return;
            }

            if (!code || code === "" || code.startsWith("{" + "{")) {
                showError('Invalid link. No code provided.');
                return;
            }

            try {
                const response = await fetch(`${window.location.origin}/verify/${code}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ password })
                });

                if (!response.ok) {
                    if (response.status === 401) {
                        showError('Incorrect password. Please try again.');
                    } else if (response.status === 404) {
                        window.location.href = '/404.html';
                    } else {
                        const error = await response.json();
                        showError(error.error || 'An error occurred');
                    }
                    return;
                }

                const redirectUrl = `${window.location.origin}/${code}?password=${encodeURIComponent(password)}`;
                window.location.href = redirectUrl;

            } catch (error) {
                showError('Failed to verify password. Please try again.');
                console.error(error);
            }
        }

        themeToggle.addEventListener('click', toggleTheme);
        passwordToggle.addEventListener('click', togglePasswordVisibility);
        passwordForm.addEventListener('submit', handlePasswordSubmit);
        initTheme();
    </script>

    <style>
        .password-container {
            display: flex;
            justify-content: center;
            max-width: 500px;
            width: 100%;
            animation: fadeInUp 0.6s ease-out;
        }

        .password-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-light);
            border-radius: 16px;
            padding: 2.5rem;
            box-shadow: var(--shadow-md);
            position: relative;
            overflow: hidden;
        }

        .password-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: var(--primary-gradient);
        }

        .password-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .password-icon-box {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, var(--accent-light) 0%, var(--secondary-light) 100%);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            color: var(--accent);
            margin: 0 auto 1.5rem;
        }

        .password-header h1 {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
        }

        .password-header p {
            font-size: 1rem;
            color: var(--text-secondary);
        }

        .password-form {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .password-input-wrapper {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            position: relative;
            width: 100%;
        }

        .password-input-wrapper .input-field {
            flex: 1;
        }

        .password-toggle {
            background: var(--bg-tertiary);
            border: 1.5px solid var(--border-light);
            width: 2.75rem;
            height: 2.75rem;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-primary);
            transition: var(--transition);
            flex-shrink: 0;
            padding: 0;
        }

        .password-toggle:hover {
            background: var(--accent-light);
            border-color: var(--accent);
            color: var(--accent);
        }

        .password-footer {
            text-align: center;
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid var(--border-light);
        }

        .password-footer p {
            font-size: 0.95rem;
            color: var(--text-secondary);
        }

        .password-footer a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
            transition: var(--transition);
        }

        .password-footer a:hover {
            color: var(--accent-hover);
            text-decoration: underline;
        }



        @media (max-width: 768px) {
            .password-card {
                padding: 2rem;
            }

            .password-header h1 {
                font-size: 1.5rem;
            }
        }

        @media (max-width: 480px) {
            .password-card {
                padding: 1.5rem;
            }

            .password-header h1 {
                font-size: 1.25rem;
            }
        }
    </style>
</body>
</html>
