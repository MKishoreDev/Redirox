<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enter Password | Redirox</title>
    <link rel="icon" type="image/png" href="/static/redirox.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.1/css/all.min.css" crossorigin="anonymous">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="app">
        <header class="navbar">
            <div class="navbar-content">
                <a href="/" class="logo-link" style="text-decoration: none;">
                    <img src="/static/redirox.png" alt="Redirox Logo" class="logo-img">
                    <span class="logo-text">Redirox</span>
                </a>
                <button class="theme-btn" id="themeToggle" title="Toggle theme">
                    <i class="fas fa-moon"></i>
                </button>
            </div>
        </header>

        <main class="content" style="display: flex; align-items: center; justify-content: center; flex: 1;">
            <div class="password-container">
                <div class="password-card">
                    <div class="password-header">
                        <div class="password-icon-box">
                            <i class="fas fa-lock"></i>
                        </div>
                        <h1>This link is password protected</h1>
                        <p>Please enter the password to continue</p>
                    </div>

                    <form id="passwordForm" class="password-form">
                        <div id="codeHolder" data-code="{{ code if code is defined else '' }}" style="display:none;"></div>
                        <div class="input-group">
                            <label for="passwordField" class="label">
                                <i class="fas fa-key"></i> Password
                            </label>
                            <div class="password-input-wrapper">
                                <input 
                                    type="password" 
                                    id="passwordField" 
                                    class="input-field"
                                    placeholder="Enter the password"
                                    required
                                    autofocus
                                >
                                <button type="button" class="password-toggle" id="passwordToggle" title="Show/Hide">
                                    <i class="fas fa-eye"></i>
                                </button>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-arrow-right"></i> Verify Password
                        </button>
                    </form>

                    <div id="errorMessage" class="error-msg" style="display: none;"></div>

                    <div class="password-footer">
                        <p>Forgot the password? <a href="/">Request a new link</a></p>
                    </div>
                </div>
            </div>
        </main>

        <footer class="footer">
            <div class="footer-inner">
                <div class="footer-left">
                    <p>Created by <strong>Kishore M</strong></p>
                    <p class="footer-tagline">Making URL sharing simple, secure, and smart</p>
                </div>
                <div class="footer-center">
                    <a href="https://github.com/MKishoreDev/Redirox" target="_blank" class="footer-link">
                        <i class="fab fa-github"></i> GitHub
                    </a>
                </div>
            </div>
        </footer>
    </div>
    <script src="/static/password.js" defer></script>
</body>
</html>
